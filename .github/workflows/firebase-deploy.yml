name: Deploy Firebase Backend
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix functions
      - run: npm install -g firebase-tools
      - name: Validate backend
        run: node --check functions/index.js
      - name: Write Firebase service account
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KAIDO_FOLLOW }}
        run: |
          test -n "$FIREBASE_SA" || (echo "Missing FIREBASE_SERVICE_ACCOUNT_KAIDO_FOLLOW" && exit 1)
          echo "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Deploy rules, indexes and functions
        run: firebase deploy --project kaido-follow-b597e --only firestore:rules,firestore:indexes,functions --non-interactive
