name: Android CI
on:
  push:
    branches: [main, 'v2/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate backend JavaScript
        run: node --check functions/index.js
      - name: Android lint
        run: gradle lintUserDebug lintAdminDebug --stacktrace
      - name: Build debug and unsigned release APKs
        run: gradle assembleUserDebug assembleAdminDebug assembleUserRelease assembleAdminRelease --stacktrace
      - name: Prepare aligned release APKs and signer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          USER_APK="$(find app/build/outputs/apk/user/release -name '*-unsigned.apk' -print -quit)"
          ADMIN_APK="$(find app/build/outputs/apk/admin/release -name '*-unsigned.apk' -print -quit)"
          test -f "$USER_APK"
          test -f "$ADMIN_APK"
          "$BT/zipalign" -c -p 4 "$USER_APK" || "$BT/zipalign" -p -f 4 "$USER_APK" dist/Kaido_Follow_User_2.0.0_unsigned.apk
          "$BT/zipalign" -c -p 4 "$ADMIN_APK" || "$BT/zipalign" -p -f 4 "$ADMIN_APK" dist/Kaido_Follow_Admin_2.0.0_unsigned.apk
          if [ ! -f dist/Kaido_Follow_User_2.0.0_unsigned.apk ]; then cp "$USER_APK" dist/Kaido_Follow_User_2.0.0_unsigned.apk; fi
          if [ ! -f dist/Kaido_Follow_Admin_2.0.0_unsigned.apk ]; then cp "$ADMIN_APK" dist/Kaido_Follow_Admin_2.0.0_unsigned.apk; fi
          cp "$BT/lib/apksigner.jar" dist/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: kaido-follow-2-debug-apks
          path: |
            app/build/outputs/apk/user/debug/*.apk
            app/build/outputs/apk/admin/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kaido-follow-2-unsigned-release-and-signer
          path: dist/*
