name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate backend JavaScript
        run: node --check functions/index.js
      - name: Build installable debug APKs
        run: gradle assembleUserDebug assembleAdminDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kaido-follow-debug-apks
          path: |
            app/build/outputs/apk/user/debug/*.apk
            app/build/outputs/apk/admin/debug/*.apk
