<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kaido Follow</title><link rel="stylesheet" href="../common.css"></head><body><div id="toast" class="toast"></div><div id="loader" class="loader"><div class="spin"></div></div>
<section id="auth" class="login"><div class="loginbox"><h2>KAIDO FOLLOW</h2><p class="muted">نسخة المستخدم</p><div id="login"><input id="le" class="input" placeholder="البريد"><input id="lp" class="input" type="password" placeholder="كلمة المرور"><button class="btn primary" onclick="login()">دخول</button><button class="btn" onclick="authMode(1)">إنشاء حساب</button><button class="btn" onclick="resetPass()">نسيت كلمة المرور</button></div><div id="reg" class="hide"><input id="rn" class="input" placeholder="الاسم"><input id="ru" class="input" placeholder="اسم المستخدم"><input id="re" class="input" placeholder="البريد"><input id="rp" class="input" type="password" placeholder="كلمة المرور"><input id="rr" class="input" placeholder="كود دعوة اختياري"><button class="btn primary" onclick="register()">إنشاء</button><button class="btn" onclick="authMode(0)">رجوع</button></div></div></section>
<div id="app" class="app hide"><header class="top"><div><div class="brand">KAIDO FOLLOW</div><div id="who" class="muted"></div></div><button class="btn" onclick="openM('notiM');readNoti()">الإشعارات</button></header>
<section id="p-home" class="page active"><div class="card"><div class="muted">الرصيد</div><div id="bal" class="balance">$0</div><div class="row"><span class="muted">المنفق <b id="spent">$0</b></span><button class="btn primary" onclick="go('wallet')">شحن</button></div></div><div id="announce" class="card hide"></div><div class="title">الأقسام</div><input id="catq" class="input" placeholder="بحث" oninput="renderCats()"><div id="cats" class="grid"></div></section>
<section id="p-orders" class="page"><div class="title">طلباتي</div><input id="oq" class="input" placeholder="بحث" oninput="renderOrders()"><div id="orders" class="list"></div></section>
<section id="p-wallet" class="page"><div class="card"><div class="muted">الرصيد الحالي</div><div id="wbal" class="balance">$0</div></div><div class="card"><b>شحن بكوبون</b><input id="coupon" class="input" placeholder="CODE"><button class="btn primary" onclick="redeem()">تفعيل</button></div><div class="card"><b>الإحالة</b><div class="row"><code id="refcode">-</code><button class="btn" onclick="copyRef()">نسخ</button></div><div class="row"><span>المدعوون <b id="refcount">0</b></span><span>الأرباح <b id="refearn">$0</b></span></div><button class="btn primary" onclick="transferRef()">تحويل الأرباح</button></div><div class="title">الحركات</div><div id="tx" class="list"></div></section>
<section id="p-support" class="page"><div class="title">الدعم</div><div id="chat" class="card chat"></div><div class="row"><input id="msg" class="input" placeholder="اكتب رسالتك"><button class="btn primary" onclick="sendMsg()">إرسال</button></div></section>
<section id="p-profile" class="page"><div class="card"><h3 id="pname"></h3><div id="pemail" class="muted"></div><input id="ename" class="input" placeholder="الاسم"><input id="euser" class="input" placeholder="اسم المستخدم"><button class="btn primary" onclick="saveProfile()">حفظ</button><button class="btn danger" onclick="logout()">تسجيل الخروج</button></div></section>
<nav class="nav"><button class="active" data-p="home" onclick="go('home')">الخدمات</button><button data-p="orders" onclick="go('orders')">الطلبات</button><button data-p="wallet" onclick="go('wallet')">المحفظة</button><button data-p="support" onclick="go('support')">الدعم</button><button data-p="profile" onclick="go('profile')">حسابي</button></nav></div>
<div id="servicesM" class="modal"><div class="sheet"><div class="row"><h3 id="stitle">الخدمات</h3><button class="btn" onclick="closeM('servicesM')">إغلاق</button></div><div id="services" class="list"></div></div></div><div id="orderM" class="modal"><div class="sheet"><div class="row"><h3>طلب جديد</h3><button class="btn" onclick="closeM('orderM')">إغلاق</button></div><div id="ssum" class="card"></div><input id="olink" class="input" placeholder="https://..."><input id="oqty" class="input" type="number" placeholder="الكمية" oninput="calc()"><div class="card row"><span>الإجمالي</span><b id="total">$0</b></div><button id="submit" class="btn primary" onclick="submitOrder()">تأكيد الطلب</button></div></div><div id="notiM" class="modal"><div class="sheet"><div class="row"><h3>الإشعارات</h3><button class="btn" onclick="closeM('notiM')">إغلاق</button></div><div id="notis" class="list"></div></div></div>
<script type="module" src="./app.js"></script></body></html>
