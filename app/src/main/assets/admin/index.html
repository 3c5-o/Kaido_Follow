<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kaido Admin</title><link rel="stylesheet" href="../common.css"><style>:root{--bg:#0d0716;--s:#171024;--s2:#251633;--b:#3c2850;--p:#8b5cf6}.app{max-width:900px}.nav{width:min(900px,100%)}</style></head><body><div id="toast" class="toast"></div><div id="loader" class="loader"><div class="spin"></div></div><section id="auth" class="login"><div class="loginbox"><h2>KAIDO ADMIN</h2><p class="muted">لوحة الإدارة الآمنة</p><input id="ae" class="input" placeholder="البريد الإداري"><input id="ap" class="input" type="password" placeholder="كلمة المرور"><button class="btn primary" onclick="adminLogin()">دخول</button></div></section>
<div id="app" class="app hide"><header class="top"><div><b>KAIDO ADMIN</b><div id="identity" class="muted"></div></div><button class="btn danger" onclick="logout()">خروج</button></header><section id="p-dashboard" class="page active"><div class="title">لوحة القيادة</div><div class="grid"><div class="card">المستخدمون <b id="su">0</b></div><div class="card">الطلبات <b id="so">0</b></div><div class="card">المبيعات <b id="ss">$0</b></div><div class="card">الربح <b id="sp">$0</b></div></div><div class="card row"><span id="health">Backend</span><button class="btn" onclick="health()">فحص</button><button class="btn primary" onclick="syncAll()">مزامنة</button></div></section>
<section id="p-orders" class="page"><div class="title">الطلبات</div><input id="os" class="input" placeholder="بحث" oninput="renderOrders()"><div id="orders" class="list"></div></section><section id="p-services" class="page"><div class="row title"><span>الخدمات</span><button class="btn primary" onclick="serviceForm()">إضافة</button></div><div id="services" class="list"></div></section><section id="p-users" class="page"><div class="title">المستخدمون</div><input id="us" class="input" placeholder="بحث" oninput="renderUsers()"><div id="users" class="list"></div></section><section id="p-more" class="page"><div class="title">الإدارة</div><div class="grid"><button class="btn" onclick="go('cats')">الأقسام</button><button class="btn" onclick="go('providers')">المزودون</button><button class="btn" onclick="go('coupons')">الكوبونات</button><button class="btn" onclick="go('support')">الدعم</button><button class="btn" onclick="go('logs')">السجل</button><button class="btn" onclick="go('settings')">الإعدادات</button></div></section><section id="p-cats" class="page"><div class="row title"><span>الأقسام</span><button class="btn primary" onclick="catForm()">إضافة</button></div><div id="cats" class="list"></div></section><section id="p-providers" class="page"><div class="row title"><span>المزودون</span><button class="btn primary" onclick="providerForm()">إضافة</button></div><div id="providers" class="list"></div></section><section id="p-coupons" class="page"><div class="row title"><span>الكوبونات</span><button class="btn primary" onclick="couponForm()">إنشاء</button></div><div id="coupons" class="list"></div></section><section id="p-support" class="page"><div class="title">الدعم</div><div id="chats" class="list"></div><div id="chatbox" class="hide"><div id="chat" class="card chat"></div><div class="row"><input id="reply" class="input"><button class="btn primary" onclick="sendReply()">إرسال</button><button class="btn" onclick="closeTicket()">إغلاق</button></div></div></section><section id="p-logs" class="page"><div class="title">سجل النشاط</div><div id="logs" class="list"></div></section><section id="p-settings" class="page"><div class="card"><input id="aff" class="input" type="number" placeholder="نسبة الإحالة"><textarea id="ann" class="input" placeholder="إعلان"></textarea><button class="btn primary" onclick="saveSettings()">حفظ</button></div></section>
<nav class="nav"><button class="active" data-p="dashboard" onclick="go('dashboard')">الرئيسية</button><button data-p="orders" onclick="go('orders')">الطلبات</button><button data-p="services" onclick="go('services')">الخدمات</button><button data-p="users" onclick="go('users')">المستخدمون</button><button data-p="more" onclick="go('more')">المزيد</button></nav></div><div id="formM" class="modal"><div class="sheet"><div class="row"><h3 id="formTitle"></h3><button class="btn" onclick="closeM('formM')">إغلاق</button></div><div id="formBody"></div></div></div><script type="module" src="./app.js"></script></body></html>
