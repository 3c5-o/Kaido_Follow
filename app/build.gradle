plugins { id 'com.android.application' }

def ksPath = System.getenv('KAIDO_KEYSTORE_PATH')
def ksAlias = System.getenv('KAIDO_KEY_ALIAS')
def ksStorePass = System.getenv('KAIDO_STORE_PASSWORD')
def ksKeyPass = System.getenv('KAIDO_KEY_PASSWORD')

android {
    namespace 'com.kaido.follow'
    compileSdk 35

    defaultConfig {
        minSdk 23
        targetSdk 35
        versionCode 20000
        versionName '2.0.0'
    }

    flavorDimensions += 'edition'
    productFlavors {
        user {
            dimension 'edition'
            applicationId 'com.kaidofollow.user'
            resValue 'string', 'app_name', 'Kaido Follow'
            buildConfigField 'String', 'START_PAGE', '"user/index.html"'
            buildConfigField 'String', 'EDITION', '"user"'
        }
        admin {
            dimension 'edition'
            applicationId 'com.kaidofollow.admin'
            resValue 'string', 'app_name', 'Kaido Follow Admin'
            buildConfigField 'String', 'START_PAGE', '"admin/index.html"'
            buildConfigField 'String', 'EDITION', '"admin"'
        }
    }

    signingConfigs {
        if (ksPath && ksAlias && ksStorePass && ksKeyPass) {
            release {
                storeFile file(ksPath)
                storePassword ksStorePass
                keyAlias ksAlias
                keyPassword ksKeyPass
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing false
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (ksPath && ksAlias && ksStorePass && ksKeyPass) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
